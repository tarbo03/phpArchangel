[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "php-archangel"
version = "1.0.0"
description = "PHP runtime security posture analyzer — detects php2shell-class CVEs (CVE-2026-109618/109619) detection, verification, and AI triage"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "php_Archangel project" }]
keywords = ["php", "security", "cve-2026-109618", "cve-2026-109619", "php-archangel", "php_archangel", "scanner", "mcp"]

dependencies = [
    "httpx>=0.27,<1.0",
    "packaging>=23.0",
    "rich>=13.7,<15; extra == 'ui'",
    "Pillow>=10.0,<13; extra == 'ui'",
    "rich>=13.7,<15; extra == 'ui'",
    "Pillow>=10.0,<13; extra == 'ui'",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
mcp     = ["mcp>=1.0"]
ai      = ["openai>=1.40", "anthropic>=0.34"]
all     = ["php-archangel[browser,mcp,ai]"]

[project.scripts]
php_archangel = "php_archangel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"php_archangel.signatures" = ["*.json", "corpus/*.json"]
