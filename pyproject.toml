[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "php-archangel-mcp"
version = "1.0.3"
description = "Precision-first PHP vulnerability scanner for php2shell (CVE-2026-109618/109619). Zero false positives by design, verified by a deterministic OOM Oracle."
authors = [{ name = "Godwin Tarbo" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "packaging>=23.0",
    "mcp>=1.0,<2.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
mcp     = []
ai      = ["openai>=1.40", "anthropic>=0.34"]
all     = ["php-archangel-mcp[browser,mcp,ai]"]

[project.urls]
Homepage = "https://github.com/tarbo03/phpArchangel"

[project.scripts]
archangel = "php_archangel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"php_archangel.signatures" = ["*.json", "corpus/*.json"]
